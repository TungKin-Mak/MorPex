name: MorPex Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.dependency-cruiser.*'
      - 'eslint.config.*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════
  # TypeScript Type Check
  # ═══════════════════════════════════════════════════════
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
        # Note: pre-existing test file errors (~225) are expected.
        # Only new errors in packages/adapters/ or packages/contracts/ are regressions.

  # ═══════════════════════════════════════════════════════
  # Dependency Boundary Check
  # ═══════════════════════════════════════════════════════
  boundary-check:
    name: Dependency Boundary Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx dependency-cruiser packages/contracts packages/connectors --config .dependency-cruiser.js

  # ═══════════════════════════════════════════════════════
  # Pi Version Audit (no floating versions)
  # ═══════════════════════════════════════════════════════
  version-audit:
    name: Pi Version Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "=== Checking Pi versions ==="
          FLOATING=$(grep -E '"@earendil-works/pi-(ai|agent-core|coding-agent)"\s*:\s*"\^|~|latest|\*"' package.json | wc -l)
          if [ "$FLOATING" -gt 0 ]; then
            echo "❌ FLOATING VERSION DETECTED"
            grep -E '"@earendil-works/pi-' package.json
            exit 1
          fi
          echo "✅ All Pi versions are exact (no ^ ~ latest)"
          grep -E '"@earendil-works/pi-' package.json

  # ═══════════════════════════════════════════════════════
  # Ontology Bypass Check (本地可运行: bash scripts/check-boundaries.sh)
  # ═══════════════════════════════════════════════════════
  ontology-bypass:
    name: Ontology Bypass Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check no new PiBridge in planning/facade/execution
        run: |
          VIO=$(grep -rn "new PiBridge" packages/core/src/cognition/planning/ packages/core/src/facade/ packages/core/src/execution/ --include="*.ts" 2>/dev/null | grep -v "__tests__" | grep -v "PiBridge.ts" | wc -l)
          if [ "$VIO" -gt 0 ]; then
            echo "❌ FAIL: planning/facade/execution 中有 new PiBridge (绕过 ontology)"
            grep -rn "new PiBridge" packages/core/src/cognition/planning/ packages/core/src/facade/ packages/core/src/execution/ --include="*.ts" | grep -v "__tests__" | grep -v "PiBridge.ts"
            exit 1
          fi
          echo "✅ planning/facade/execution 无 new PiBridge 绕过"
      - name: Check planner does not import SystemMetadataGraph directly
        run: |
          VIO=$(grep -rn "SystemMetadataGraph" packages/core/src/cognition/planning/ --include="*.ts" 2>/dev/null | grep -v "__tests__" | wc -l)
          if [ "$VIO" -gt 0 ]; then
            echo "❌ FAIL: planning 直接 import SystemMetadataGraph (应通过 OntologyService)"
            grep -rn "SystemMetadataGraph" packages/core/src/cognition/planning/ --include="*.ts" | grep -v "__tests__"
            exit 1
          fi
          echo "✅ planning 通过 OntologyService 访问图数据"

  # ═══════════════════════════════════════════════════════
  # Ontology E2E (需要真实 LLM API key, 标记为 continue-on-error)
  # ═══════════════════════════════════════════════════════
  ontology-e2e:
    name: Ontology E2E
    needs: [typecheck, boundary-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run ontology gate tiering tests
        run: npx vitest run packages/core/__tests__/ontology-gate-tiering.test.ts
        env:
          # 需要真实 LLM API key 才能完整运行
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
