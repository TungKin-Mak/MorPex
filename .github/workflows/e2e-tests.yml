name: MorPex E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════
  # 后端系统级 E2E（前端 UI 已于 S23 移除，纯 API/系统层测试）
  # 依据 docs/TESTING_PLAN.md T0-T3 编排
  # ═══════════════════════════════════════════════════════
  system-e2e:
    name: Backend System E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Architecture Alignment Check
        run: node scripts/validate-architecture.js

      - name: Unit + System Test Suite (T1-T2)
        run: npx vitest run && npx tsx tests/run-all.ts

      - name: Production Critical Tests (T3)
        run: npx tsx scripts/run-all-production-tests.ts --skip-tsc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: data/test-report/
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 7
