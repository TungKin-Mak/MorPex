name: MorPex E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════
  # 后端系统级 E2E（前端 UI 已于 S23 移除，纯 API/系统层测试）
  # 依据 docs/TESTING_PLAN.md T0-T3 编排
  # ═══════════════════════════════════════════════════════
  system-e2e:
    name: Backend System E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Architecture Alignment Check
        run: node scripts/validate-architecture.js

      - name: Unit + System Test Suite (T1-T2)
        run: npx vitest run && npx tsx tests/run-all.ts

      - name: Production Critical Tests (T3)
        run: npx tsx scripts/run-all-production-tests.ts --skip-tsc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: data/test-report/
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 7

  # ═══════════════════════════════════════════════════════
  # 覆盖率报告（P2：@vitest/coverage-v8，阈值防回退）
  # ═══════════════════════════════════════════════════════
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: data/test-report/coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════
  # k6 负载冒烟（P2：可选 job——需 Docker；后端在线则验证 P95/错误率阈值）
  # ═══════════════════════════════════════════════════════
  k6-smoke:
    name: k6 Load Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Start backend
        run: |
          npx tsx scripts/start.ts &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/health
      - name: Run k6 smoke via Docker
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -e API_URL=http://localhost:8080 \
            -v "$PWD/scripts:/scripts" \
            grafana/k6 run --vus 5 --duration 30s /scripts/k6-smoke.js
