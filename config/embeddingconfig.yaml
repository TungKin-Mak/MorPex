# MorPex Embedding 配置（会话 16k：RAG-lazy 装配的向量检索增强）
# 参考: https://api-docs.siliconflow.cn/docs/api/embeddings-post
#
# embedding.enabled=true + apiKey 可用 → ContextRetriever 注入 similarityScorer（BAAI/bge-m3 向量余弦）
# 否则 → 回退关键词/domain 确定性检索（默认行为不变）
#
# apiKey 支持 ${VAR} 环境变量引用（process.env → Windows 用户级兑底），敏感值不写明文
embedding:
  enabled: true
  provider: siliconflow        # 向量服务商标识（仅作记录，不硬编码进代码）
  baseUrl: https://api.siliconflow.cn/v1   # OpenAI 兼容 embeddings 端点（POST {baseUrl}/embeddings）
  apiKey: ${SILICONFLOW_API_KEY}           # ← 环境变量 SILICONFLOW_API_KEY
  model: BAAI/bge-m3                       # 向量模型（1024 维）
  dimensions: 1024
  batchSize: 8                             # 单次请求批量 embedding 数
  contextRetrieval:
    enabled: true                          # 装配检索注入开关
    topK: 5                                # Top-K 召回数
    minScore: 0.3                          # 相似度阈值（低于不召回）
