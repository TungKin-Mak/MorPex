# MorPex LLM 配置（会话 11：config 为唯一模型来源，抽离代码硬编码）
#
# llm.mode:
#   - builtin  → 使用 pi-ai 内置 provider（provider/model 从 config 读；apiKey 由 provider 自带 env 解析，
#                或经 llm.apiKey 注入——config apiKey 支持 ${VAR} 环境变量引用 + Windows 用户级兑底）
#   - gateway  → 自定义 OpenAI 兼容网关（baseUrl + apiKey）
#
# 内置 provider 示例（pi-ai builtinModels）：opencode / opencode-go / anthropic / openai / zai-coding-cn ...
llm:
  mode: builtin          # builtin=pi-ai 内置 provider（opencode 等）；gateway=自定义网关
  enabled: true          # LLM 总开关
  provider: opencode     # 模型来源 provider（内置 provider id 或自定义网关标识）
  model: deepseek-v4-flash-free   # 模型名（opencode 内置：deepseek-v4-flash-free / deepseek-v4-flash ...）
  baseUrl: https://opencode.ai/zen/v1
  apiKey: ${OPENCODE_API_KEY}   # ← 从环境变量 OPENCODE_API_KEY 读取（Windows 用户级兑底）
  contextWindow: 200000
  maxTokens: 128000
