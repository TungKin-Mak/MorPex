# MorPex LLM 配置（会话 10：仅 GLM-4.7-Flash，已移除 deepseek）
#
# 配置了 llm 且 enabled: true → 使用自定义 OpenAI 兼容网关（GLM-4.7-Flash，智谱）
# 未配置 / enabled: false    → 使用内置默认 GLM-4.7-Flash（读 GLM_API_KEY，Windows 用户级兑底）
#
# 网关：https://open.bigmodel.cn/api/paas/v4（智谱开放平台，OpenAI 兼容）
#   apiKey 从环境变量 GLM_API_KEY 读取（process.env → Windows 用户级兑底）
#   model 填 glm-4.7-flash（思考模式默认开启）
llm:
  enabled: true      # ← true=使用智谱 GLM 网关；false=内置默认（仍 GLM-4.7-Flash）
  provider: zhipu-glm     # 自定义 provider 标识（内部用）
  baseUrl: https://open.bigmodel.cn/api/paas/v4   # GLM-4.7-Flash（智谱，OpenAI 兼容）
  apiKey: ${GLM_API_KEY}   # ← 从环境变量 GLM_API_KEY 读取
  model: glm-4.7-flash
  contextWindow: 200000
  maxTokens: 128000
